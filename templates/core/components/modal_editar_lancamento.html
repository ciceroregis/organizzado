<!-- MODAL: EDITAR LANÇAMENTO / SALÁRIO MANUALMENTE -->
<div class="modal fade" id="modalEditarLancamento" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <form method="post">
                {% csrf_token %}
                <input type="hidden" name="acao" value="editar_lancamento">
                <input type="hidden" name="lancamento_id" id="edit_lancamento_id">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title fw-bold">
                        <i class="bi bi-pencil-square me-1"></i> Editar Lançamento / Salário Manualmente
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label fw-semibold">Data</label>
                            <input type="date" name="data" id="edit_data" class="form-control" required>
                        </div>
                        <div class="col-md-8">
                            <label class="form-label fw-semibold">Descrição</label>
                            <input type="text" name="descricao" id="edit_descricao" class="form-control" maxlength="140" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-semibold">Categoria</label>
                            <select name="categoria" id="edit_categoria" class="form-select" required>
                                {% for cat in form_lancamento.fields.categoria.queryset %}
                                    <option value="{{ cat.pk }}">{{ cat }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-semibold">Valor Manual (R$)</label>
                            <input type="text" inputmode="numeric" name="valor" id="edit_valor" class="form-control mask-money fw-bold" placeholder="R$ 0,00" autocomplete="off" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-semibold">Forma de Pagamento</label>
                            <select name="forma_pagamento" id="edit_forma_pagamento" class="form-select" required>
                                {% for val, label in form_lancamento.fields.forma_pagamento.choices %}
                                    <option value="{{ val }}">{{ label }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Ciclo Salarial Alocado</label>
                            <select name="ciclo" id="edit_ciclo" class="form-select" required>
                                {% for val, label in form_lancamento.fields.ciclo.choices %}
                                    <option value="{{ val }}">{{ label }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Status de Pagamento</label>
                            <select name="status" id="edit_status" class="form-select" required>
                                {% for val, label in form_lancamento.fields.status.choices %}
                                    <option value="{{ val }}">{{ label }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-8">
                            <label class="form-label fw-semibold">Observação</label>
                            <input type="text" name="observacao" id="edit_observacao" class="form-control">
                        </div>
                        <div class="col-md-4 d-flex align-items-end">
                            <div class="form-check mb-2">
                                <input type="checkbox" name="fixo_recorrente" id="edit_fixo" class="form-check-input">
                                <label class="form-check-label fw-semibold" for="edit_fixo">
                                    Lançamento Fixo Mensal
                                </label>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary fw-semibold">
                        <i class="bi bi-check2-circle me-1"></i> Salvar Alterações Manuais
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
